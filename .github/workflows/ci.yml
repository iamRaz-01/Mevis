name: MEVIS Monorepo CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build & Verify Monorepo Workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-level: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Workspace
        run: npm run lint

      - name: Check Formatting
        run: npm run format:check

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test

      - name: Build Workspace
        run: npm run build

      - name: Verify Monorepo Configuration
        run: python scripts/verify-monorepo.py

      - name: Verify Import Boundaries
        run: python scripts/verify-boundaries.py
