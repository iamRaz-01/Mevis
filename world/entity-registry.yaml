# MEVIS Digital Twin Entity Registry
# Canonical catalog of everything that may exist in the operational world.

entities:
  - name: Venue
    type: Physical
    id_pattern: '^ven_[a-zA-Z0-9_-]+$'
    description: 'Lusail Stadium location structure.'
    owning_context: 'Administration'

  - name: Zone
    type: Physical
    id_pattern: '^zon_[a-zA-Z0-9_-]+$'
    description: 'Concourse, sectors, and seating blocks.'
    owning_context: 'Administration'
    parent: Venue

  - name: Gate
    type: Physical
    id_pattern: '^gat_[a-zA-Z0-9_-]+$'
    description: 'Access control entry/exit gates.'
    owning_context: 'Administration'
    parent: Zone

  - name: Volunteer
    type: Resource
    id_pattern: '^vol_[a-zA-Z0-9_-]+$'
    description: 'Registered volunteer profiles.'
    owning_context: 'Volunteer Management'

  - name: Incident
    type: Operational
    id_pattern: '^inc_[a-zA-Z0-9_-]+$'
    description: 'Triaged incident reports.'
    owning_context: 'Incident Management'

  - name: Task
    type: Operational
    id_pattern: '^tsk_[a-zA-Z0-9_-]+$'
    description: 'Assigned actions to resolve incidents.'
    owning_context: 'Incident Management'

  - name: Recommendation
    type: Cognitive
    id_pattern: '^rec_[a-zA-Z0-9_-]+$'
    description: 'Suggested decisions generated by AI.'
    owning_context: 'Recommendation Engine'
