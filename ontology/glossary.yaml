# MEVIS Domain Glossary Definitions
# Defines vocabulary mapping constraints for AI reasoning and validation models.

vocabulary:
  - term: Volunteer
    prefix: vol_
    meaning: 'A registered event assistant who performs assigned duties, monitors spaces, and executes tasks.'
    forbidden_synonyms: [coordinator, supervisor, manager, admin]
    owner: 'Volunteer Management'

  - term: Supervisor
    prefix: sup_
    meaning: 'An operations lead overseeing volunteers, triaging local incidents, and approving safety actions.'
    forbidden_synonyms: [volunteer, steward, helper, coordinator]
    owner: 'Volunteer Management'

  - term: Coordinator
    prefix: coo_
    meaning: 'A command center dispatcher responsible for global stadium coordination and incident management.'
    forbidden_synonyms: [supervisor, volunteer, assistant]
    owner: 'Operations Command'

  - term: Venue
    prefix: ven_
    meaning: 'The complete physical stadium hosting the mega-event.'
    forbidden_synonyms: [zone, gate, city]
    owner: 'World State'

  - term: Zone
    prefix: zon_
    meaning: 'A defined sector or area inside a Venue.'
    forbidden_synonyms: [gate, venue, turnstile]
    owner: 'World State'

  - term: Gate
    prefix: gat_
    meaning: 'A physical turnstile or ingress/egress point within a Zone.'
    forbidden_synonyms: [zone, concourse, lobby]
    owner: 'World State'

  - term: Incident
    prefix: inc_
    meaning: 'Any operational disruption, safety risk, accessibility bottleneck, or medical emergency.'
    forbidden_synonyms: [event, recommendation, SOP, policy]
    owner: 'Incident Management'

  - term: Shift
    prefix: shf_
    meaning: 'A scheduled block of time during which volunteers and supervisors are active.'
    forbidden_synonyms: [task, incident, route]
    owner: 'Volunteer Management'

  - term: Task
    prefix: tsk_
    meaning: 'A discrete actionable instruction assigned to a volunteer to resolve an incident.'
    forbidden_synonyms: [incident, recommendation, shift]
    owner: 'Incident Management'

  - term: Recommendation
    prefix: rec_
    meaning: 'A candidate action plan and rationale generated by the AI Orchestrator.'
    forbidden_synonyms: [command, decision, order, policy]
    owner: 'AI Intelligence'

  - term: SOP
    prefix: sop_
    meaning: 'Standard Operating Procedure: a verified procedure document resolving specific incident classes.'
    forbidden_synonyms: [policy, recommendation, manual]
    owner: 'Knowledge Management'

  - term: Policy
    prefix: pol_
    meaning: 'An executable rule or constraint that defines whether a candidate action is allowed.'
    forbidden_synonyms: [SOP, recommendation, guideline]
    owner: 'Admin & Governance'

  - term: Evidence
    prefix: evd_
    meaning: 'Factual reference document segment or relation used to ground a recommendation.'
    forbidden_synonyms: [assumption, hypothesis, opinion]
    owner: 'Knowledge Management'

  - term: Observation
    prefix: obs_
    meaning: 'A raw sensor reading, crowd metric, or volunteer report before triage.'
    forbidden_synonyms: [incident, decision]
    owner: 'World State'

  - term: Decision
    prefix: dec_
    meaning: 'The final committed action chosen by a human operator in response to a recommendation.'
    forbidden_synonyms: [recommendation, event]
    owner: 'Analytics & Learning'

  - term: Context
    prefix: ctx_
    meaning: 'The canonical context object containing current state, policies, and RAG facts.'
    forbidden_synonyms: [state, history, environment]
    owner: 'Context Engine'

  - term: Event
    prefix: evt_
    meaning: 'A technical message representing a discrete state transition in the system.'
    forbidden_synonyms: [incident, mega-event]
    owner: 'Event Bus'

  - term: Approval
    prefix: app_
    meaning: 'Explicit human authorization required to execute restricted tasks or release recommendations.'
    forbidden_synonyms: [request, suggestion]
    owner: 'Policy & Trust'
