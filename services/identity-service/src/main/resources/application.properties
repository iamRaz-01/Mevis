# MEVIS Identity Service Configuration

spring.application.name=identity-service

# Datasource configuration (Default: in-memory H2 database)
spring.datasource.url=jdbc:h2:mem:mevis_identity_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Properties
mevis.security.jwt.secret=default-secret-key-must-be-very-long-and-secure-for-hs256-compliance-minimum-32-bytes
mevis.security.jwt.expiration-ms=3600000
