version: '3.8'

# ============================================================
# MEVIS Production Docker Compose
# Deploys the full MEVIS backend stack
# ============================================================

services:
  # 1. Context Service — Core Operational Intelligence Engine
  context-service:
    build:
      context: .
      dockerfile: services/context-service/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3008
      - DB_URL=/data/mevis.db
      - LOG_LEVEL=info
    ports:
      - "3008:3008"
    volumes:
      - context_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const h = require('http'); h.get('http://localhost:3008/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 2. API Gateway — Entry Point & Service Registry
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=8000
      - LOG_LEVEL=info
      - CONTEXT_SERVICE_URL=http://context-service:3008
    ports:
      - "8000:8000"
    depends_on:
      context-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const h = require('http'); h.get('http://localhost:8000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  context_data:
    driver: local
