# MEVIS Retrieval Example
# Represents query requesting weather hazard evacuation steps.

retrieval_request:
  query_text: 'lightning hazard evacuations step routing'
  context_scope: 'EmergencyResponse'
  filters:
    domain: 'Emergency'
    min_trust: 0.95

evidence_package:
  package_id: 'pkg_retrieval_weather_003'
  citations:
